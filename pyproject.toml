[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "oci-security-center"
version = "0.1.0"
description = "Read-only security posture tool for OCI Organizations (parent + child tenancies)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Kiran Thakkar" }]
# Pinned per AGENTS.md §2.7. Justify every addition in the PR description.
dependencies = [
  "oci==2.187.2",                 # official OCI SDK (signing, clients, TokenExchangeSigner)
  "pydantic==2.13.5",             # domain models
  "pydantic-settings==2.15.0",    # env-based settings
  "typer==0.27.3",                # CLI
  "fastapi==0.142.4",             # web admin UI + API
  "uvicorn==0.54.0",              # ASGI server
  "jinja2==3.1.6",                # server-rendered templates (autoescaped)
  "python-multipart==0.0.32",     # form posts (FastAPI requirement for Form)
  "authlib==1.8.0",               # OIDC client: auth code + PKCE, ID token validation
  "httpx==0.28.1",                # required by authlib's Starlette client
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-mock==3.16.0",
  "ruff==0.16.10",
  "mypy==2.4.0",
]

[project.scripts]
osc = "oci_security_center.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/oci_security_center"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PT", "C4", "T20"]
ignore = [
  "S101",   # assert is fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "T20"]
"src/oci_security_center/cli.py" = ["T20", "B008"]
"src/oci_security_center/web/**" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["oci_security_center"]

[[tool.mypy.overrides]]
module = ["oci", "oci.*", "authlib", "authlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits a real OCI tenancy (read-only); skipped by default"]
addopts = "-m 'not live' -q"
