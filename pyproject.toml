[build-system]
requires = ["hatchling==1.32.4", "editables==0.6"]
build-backend = "hatchling.build"

[project]
name = "oci-governance-center"
version = "0.1.0"
description = "Read-only governance and observability for OCI organizations"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
  "oci==2.189.0",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.1",
  "typer==0.27.3",
  "fastapi==0.161.0",
  "uvicorn==0.54.0",
  "jinja2==3.1.6",
  "python-multipart==0.0.32",
  "authlib==1.9.1",
  "joserfc==1.7.7",
  "httpx==0.28.1",
  "cryptography==50.0.2",
  "requests==2.34.2",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-mock==3.17.0",
  "ruff==0.17.2",
  "mypy==2.4.0",
  "types-requests==2.33.0.20261006",
]

[project.scripts]
ogc = "oci_governance_center.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/oci_governance_center"]

[tool.ruff]
line-length = 100
target-version = "py311"
include = ["*.py", "*.pyi", "pyproject.toml"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "T20"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "T20"]
"src/oci_governance_center/web/app.py" = ["B008"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["oci.*", "authlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["live: authorized non-production OCI checks only"]
